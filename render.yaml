# Blueprint da Render: cria app, banco e agendador de uma vez.
databases:
  - name: safraquest-db
    plan: basic-256mb

services:
  - type: web
    name: safraquest
    runtime: docker
    plan: starter
    healthCheckPath: /entrar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safraquest-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: WHATSAPP_PROVIDER
        value: console
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL # e-mail de dúvidas e problemas (aparece no app e nos e-mails)
        value: safraquest@gmail.com
      - key: ADMIN_NAME
        value: Marketing
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: cron
    name: safraquest-agendador
    runtime: docker
    plan: starter
    schedule: "*/10 * * * *"
    dockerCommand: node cron.mjs
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: safraquest
          envVarKey: CRON_SECRET
      - key: APP_HOSTPORT
        fromService:
          type: web
          name: safraquest
          property: hostport
